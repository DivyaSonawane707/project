<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style1.css" />
</head>
<body>
  <div class="weather-container">
    <header>
      <h1>Weatherly</h1>
      <p>Kolhapur, India</p>
    </header>

    <div class="current-weather glass">
      <div class="left">
        <h2>26°C</h2>
        <p>Partly Cloudy</p>
        <span>Feels like 28°C</span>
      </div>
      <div class="right">
        <img src="https://openweathermap.org/img/wn/02d@2x.png" alt="weather icon">
      </div>
    </div>

    <div class="details glass">
      <div class="item"><h4>Humidity</h4><p>55%</p></div>
      <div class="item"><h4>Wind</h4><p>14 km/h</p></div>
      <div class="item"><h4>Pressure</h4><p>1014 hPa</p></div>
      <div class="item"><h4>Visibility</h4><p>10 km</p></div>
    </div>

    <h3>Next 5 Days</h3>
    <div class="forecast glass">
      <div class="day"><p>Thu</p><img src="https://openweathermap.org/img/wn/01d.png"><span>30°C / 22°C</span></div>
      <div class="day"><p>Fri</p><img src="https://openweathermap.org/img/wn/02d.png"><span>28°C / 21°C</span></div>
      <div class="day"><p>Sat</p><img src="https://openweathermap.org/img/wn/03d.png"><span>27°C / 20°C</span></div>
      <div class="day"><p>Sun</p><img src="https://openweathermap.org/img/wn/04d.png"><span>26°C / 19°C</span></div>
      <div class="day"><p>Mon</p><img src="https://openweathermap.org/img/wn/10d.png"><span>25°C / 18°C</span></div>
    </div>
  </div>
</body>
</html>
